# Experiment: DeepSurv with Full Gene Set (14,778 genes)
# Based on: Katzman et al., 2018, BMC Medical Research Methodology

experiment:
  name: "deepsurv_full_genes"
  description: "DeepSurv baseline with all common genes"
  dataset_type: "full_genes"
  model_type: "deepsurv"
  seed: 42

# Dataset configuration
dataset:
  name: "full_genes"
  tcga_expression: "tcga_batch_corrected_2sv.csv"
  orien_expression: "orien_batch_corrected.csv"
  tcga_survival: "surv_tcga.csv"
  orien_survival: "surv_orien_update.csv"
  use_common_genes: true
  min_variance_percentile: 10
  standardize: true

# Model configuration
model:
  type: "deepsurv"
  hidden_sizes: [512, 256]
  dropout: 0.4
  activation: "relu"
  batch_norm: true
  weight_init: "xavier_uniform"

# Training configuration
training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.01
  num_epochs: 200
  early_stopping_patience: 20
  valid_split: 0.2

# Evaluation
evaluation:
  metrics: ["c_index", "brier_score"]
  directions: ["tcga_to_orien", "orien_to_tcga", "combined"]

# Paths
paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  results_dir: "results"
  logs_dir: "logs"

# Compute
compute:
  device: "auto"  # auto, cuda, mps, cpu
  num_workers: 2
