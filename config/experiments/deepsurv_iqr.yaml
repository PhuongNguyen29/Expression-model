# Experiment: DeepSurv with IQR Filtered Genes
# Reduces dimensionality using Interquartile Range filtering

experiment:
  name: "deepsurv_iqr_filtered"
  description: "DeepSurv with IQR-filtered genes (reduced dimensionality)"
  dataset_type: "iqr_filtered"
  model_type: "deepsurv"
  seed: 42

# Dataset configuration
dataset:
  name: "iqr_filtered"
  tcga_expression: "tcga_iqr_filtered_30.csv"
  orien_expression: "orien_iqr_filtered_30.csv"
  tcga_survival: "surv_tcga.csv"
  orien_survival: "surv_orien_update.csv"
  use_common_genes: true
  min_variance_percentile: 0  # Already filtered
  standardize: true

# Model configuration
model:
  type: "deepsurv"
  hidden_sizes: [256, 128]  # Smaller network for fewer genes
  dropout: 0.3
  activation: "relu"
  batch_norm: true
  weight_init: "xavier_uniform"

# Training configuration
training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.001  # Less regularization with fewer features
  num_epochs: 200
  early_stopping_patience: 20
  valid_split: 0.2

# Evaluation
evaluation:
  metrics: ["c_index", "brier_score"]
  directions: ["tcga_to_orien", "orien_to_tcga", "combined"]

# Paths
paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  results_dir: "results"
  logs_dir: "logs"

# Compute
compute:
  device: "auto"
  num_workers: 2
